name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secrets
        run: |
          pip install -e ".[dev]"
          python scripts/validate_secrets.py --strict
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://placeholder/placeholder
          ENVIRONMENT: production
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Settings refuses to load in production with the default value.
          QR_HMAC_SECRET: ${{ secrets.QR_HMAC_SECRET }}
          SEMAPHORE_API_KEY: ${{ secrets.SEMAPHORE_API_KEY }}
          ITEXMO_API_KEY: ${{ secrets.ITEXMO_API_KEY }}
          PHILSMS_TOKEN: ${{ secrets.PHILSMS_TOKEN }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          ADMIN_ALERT_PHONE: ${{ secrets.ADMIN_ALERT_PHONE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Builds the backend image on the server and restarts the stack.
          # Migrations run automatically when the backend container starts
          # (RUN_MIGRATIONS=true in docker-compose.server.yml).
          # The frontend deploys separately via Vercel's Git integration.
          script: |
            set -e
            cd /opt/smarthealth-hub
            git pull --ff-only origin main
            docker compose -f docker-compose.server.yml --env-file .env.server up -d --build --remove-orphans
            docker image prune -f
            echo "Deploy complete: $(date)"
