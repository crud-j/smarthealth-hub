name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Shared env for backend tests and E2E
  DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: test-secret-key-not-for-production-use
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 480
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
  QR_HMAC_SECRET: test-hmac-secret-not-for-production-use
  QR_BASE_URL: http://localhost:3000
  SEMAPHORE_API_KEY: test-key
  SEMAPHORE_SENDER_NAME: TestBHC
  SMS_REMINDER_LEAD_HOURS: 24
  SMS_MAX_RETRIES: 3
  # Use a real 32-byte key (base64 of 32 zero bytes — for CI only)
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  EMAIL_HOST: smtp.gmail.com
  EMAIL_PORT: 587
  EMAIL_USE_TLS: "true"
  EMAIL_FROM_NAME: BHC-Verify
  EMAIL_HOST_USER: test@example.com
  EMAIL_HOST_PASSWORD: testpassword
  CORS_ORIGINS: '["http://localhost:3000"]'

jobs:
  # ── Frontend build + lint ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm --filter web build

      - name: Lint Next.js app
        run: pnpm --filter web lint

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Pytest (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    # Real PostgreSQL and Redis services — the backend tests connect to these.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shh_admin
          POSTGRES_PASSWORD: SmartHealthHub
          POSTGRES_DB: smarthealthhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations on test DB
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub_test

      - name: Run tests
        run: pytest tests --cov=app --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub_test

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Backend lint (ruff + mypy) ───────────────────────────────────────────────
  backend-lint:
    name: Backend — Ruff & Mypy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Mypy type check
        run: mypy app

  # ── E2E — Playwright against full docker-compose stack ──────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    # Only run E2E on pushes to main and on PRs targeting main to save CI time.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: [frontend-build, backend-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shh_admin
          POSTGRES_PASSWORD: SmartHealthHub
          POSTGRES_DB: smarthealthhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub

      - name: Seed E2E test data
        run: python tests/e2e_seed.py
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub

      - name: Start FastAPI backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@localhost:5432/smarthealthhub

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm --filter web build
        env:
          SERVER_SIDE_API_URL: http://localhost:8000

      - name: Start Next.js
        run: pnpm --filter web start &
        env:
          PORT: 3000

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:8000/health http://localhost:3000 --timeout 60000
        working-directory: frontend/web

      - name: Run Playwright E2E tests
        run: pnpm --filter web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          retention-days: 7
