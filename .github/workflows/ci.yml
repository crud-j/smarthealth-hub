name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check backend/app
      - run: ruff format --check backend/app

  lint-frontend:
    name: Lint — Frontend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
        working-directory: frontend/web
      - name: Check API types are up to date
        # Skipped in CI since backend is not running — use as local developer tool only.
        # To enable: start backend as a service container and run npm run generate:api
        # Local usage: npm run generate:api (requires backend on localhost:8000)
        run: echo "API type generation skipped in CI — run 'npm run generate:api' locally after backend schema changes"

  typecheck-backend:
    name: Type Check — Backend (mypy)
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy && pip install -e ".[dev]"
        working-directory: backend
      - run: mypy app --ignore-missing-imports
        working-directory: backend

  typecheck-frontend:
    name: Type Check — Frontend (tsc)
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: frontend/web

  test-backend:
    name: Test — Backend (pytest)
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smarthealth_test
          POSTGRES_USER: smarthealth
          POSTGRES_PASSWORD: ci-test-password
        options: >-
          --health-cmd "pg_isready -U smarthealth -d smarthealth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pytest --cov=app --cov-fail-under=70 --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://smarthealth:ci-test-password@localhost:5432/smarthealth_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS10ZXN0dGVzdA==
          SEMAPHORE_API_KEY: test-semaphore-key
          EMAIL_HOST_USER: ""
          EMAIL_HOST_PASSWORD: ""
          ADMIN_ALERT_PHONE: ""

  build-backend:
    name: Build — Backend Docker Image
    runs-on: ubuntu-latest
    needs: [typecheck-backend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t smarthealth-hub-backend ./backend

  build-frontend:
    name: Build — Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ github.ref_name }}" || echo "No changes to commit"
          git push
