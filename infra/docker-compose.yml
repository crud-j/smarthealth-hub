# SmartHealth Hub — infra/docker-compose.yml
# Legacy compose file used by the infra/ setup.
# Prefer the canonical root-level docker-compose.yml for new deployments.
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up --build
#   Infrastructure only: docker compose -f infra/docker-compose.yml up db redis -d

services:
  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      SERVER_SIDE_API_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    networks:
      - smarthealth

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@db:5432/smarthealthhub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smarthealth

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@db:5432/smarthealthhub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smarthealth

  # ── Celery Beat Scheduler ─────────────────────────────────────────────────────
  worker-beat:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.worker
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://shh_admin:SmartHealthHub@db:5432/smarthealthhub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - api
    restart: unless-stopped
    networks:
      - smarthealth

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarthealthhub
      POSTGRES_USER: shh_admin
      POSTGRES_PASSWORD: SmartHealthHub
    ports:
      - "5445:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shh_admin -d smarthealthhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthealth

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smarthealth

volumes:
  pgdata:
    name: smarthealth_pgdata
  redisdata:
    name: smarthealth_redisdata

networks:
  smarthealth:
    driver: bridge
    name: smarthealth_network
